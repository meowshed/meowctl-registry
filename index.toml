# meowctl module registry index
#
# compat: schema version. Loaders MUST warn (not fail) when compat > 1.
# modules: map of module name → entry.
#
# Each entry:
#   repo      — optional "owner/repo" on GitHub; used by the auto-update job.
#   versions  — ascending semver list; most-recent last.
#   source    — URL template; {name} and {version} are substituted.
#   integrity — subtable mapping version → sha384 SRI hash of that tarball.
#               The loader verifies each tarball against this hash on first
#               download. Entries may be omitted for older versions (the loader
#               falls back to compute-then-store in the lock file).

compat = 1

[modules.dotmeow]
repo     = "meowshed/dotmeow"
versions = ["0.3.27"]
source   = "https://github.com/meowshed/dotmeow/releases/download/{version}/dotmeow-{version_no_v}.tar.gz"

[modules.dotmeow.integrity]
"0.3.27" = "sha384-3NhCk4/KQY+ILcTLVgRiZ1mlHAlnMOeZUuZ0355dxT8eoIDmjA/ILz+gOosIa+Ib"

[modules.stdlib]
repo     = "meowshed/meowctl-stdlib"
versions = ["0.2.17"]
source   = "https://github.com/meowshed/meowctl-stdlib/releases/download/{version}/meowctl-stdlib-{version_no_v}.tar.gz"

[modules.stdlib.integrity]
"0.2.17" = "sha384-0gvw9vrOaEoR9IayooVXobEYhQ93roob7rLiujd0jVinNHnh6fbV/dJPzFj0T4Zc"

[modules.adaptive-keyboard-layouts]
