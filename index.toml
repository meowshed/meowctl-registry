# compat: schema version. Loaders MUST warn (not fail) when compat > 1.
# modules: map of module name → entry.
#
# Each entry:
#   repo      — optional "owner/repo" on GitHub; used by the auto-update job.
#   versions  — ascending semver list; most-recent last.
#   source    — URL template; {name} and {version} are substituted.
#   integrity — subtable mapping version → sha384 SRI hash of that tarball.
#               The loader verifies each tarball against this hash on first
#               download. Entries may be omitted for older versions (the loader
#               falls back to compute-then-store in the lock file).

