name: Auto-update index

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:        # on-demand via GitHub UI or gh CLI

permissions:
  contents: write

jobs:
  update:
    name: Check for new releases and update index.toml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run update script
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/update-index.sh index.toml
          if git diff --quiet index.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate updated index
        if: steps.update.outputs.changed == 'true'
        run: |
          git fetch origin main
          git show origin/main:index.toml > /tmp/index-base.toml 2>/dev/null || touch /tmp/index-base.toml
          bash scripts/validate-index.sh index.toml /tmp/index-base.toml

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.toml
          git commit -m "chore: auto-update index with new module releases"
          git push
